<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHITE_ROOM_COMMAND_v7.0</title>
    <style>
        :root {
            --accent-color: #ef4444;
            --accent-glow: rgba(239, 68, 68, 0.2);
        }
        html, body {
            margin: 0; padding: 15px;
            background-color: #050608 !important;
            color: #d1d5db !important;
            font-family: 'Courier New', monospace;
            height: 100vh; box-sizing: border-box; overflow: hidden;
        }
        .workspace-grid {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 15px;
            height: calc(100vh - 90px);
        }
        .hud-panel {
            background: #0d1117;
            border: 1px solid #21262d;
            border-top: 3px solid var(--accent-color);
            border-radius: 6px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        .title { color: var(--accent-color); font-size: 22px; font-weight: 900; margin: 0; letter-spacing: 1px; }
        .media-split { display: grid; grid-template-rows: 1.2fr 1fr; gap: 15px; height: 100%; }
        .cyber-input { 
            width: 100%; padding: 12px; background: #010409; 
            border: 1px solid #30363d; color: #fff; 
            margin-bottom: 12px; box-sizing: border-box; font-family: inherit;
        }
        .cyber-input:focus { border-color: var(--accent-color); outline: none; }
        .action-btn { 
            background: var(--accent-color); color: #fff; border: none; padding: 12px; 
            font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 11px; 
        }
        .action-btn:hover { background: #991b1b; box-shadow: 0 0 10px var(--accent-color); }
        .action-btn:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; box-shadow: none; }
        .timeline-scroll { overflow-y: auto; flex-grow: 1; margin-top: 10px; padding-right: 5px; }
        .video-container { width: 100%; height: 100%; background: #000; border-radius: 4px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
        .social-dock { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px; }
        .dock-btn { 
            padding: 14px; background: #161b22; border: 1px solid #30363d; 
            color: #fff; cursor: pointer; text-align: center; text-decoration: none; 
            font-size: 11px; font-weight: bold; border-radius: 4px;
        }
        .dock-btn:hover { border-color: var(--accent-color); background: var(--accent-glow); }
        .queue-item {
            background: #010409; border: 1px solid #30363d;
            padding: 8px; margin-top: 5px; border-radius: 4px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px;
        }
        .theme-select {
            background: #010409; color: #fff; border: 1px solid #30363d;
            padding: 5px; font-family: inherit; font-size: 11px; border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- HUD Header -->
    <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid #21262d; padding-bottom:10px;">
        <div>
            <h1 class="title">WHITE_ROOM_COMMAND_v7.0</h1>
            <span style="font-size:10px; color:#8b949e; font-weight:bold; letter-spacing:1px;">INTEGRATED MULTI-MATRIX ENVIRONMENT</span>
        </div>
        <div style="display: flex; gap: 15px; align-items: center;">
            <select class="theme-select" onchange="changeTheme(this.value)">
                <option value="#ef4444">🔴 RED ALERT</option>
                <option value="#10b981">🟢 CYBER HUNTER</option>
                <option value="#3b82f6">🔵 DEEP SPACE</option>
                <option value="#f59e0b">🟡 CODM GOLD ELITE</option>
            </select>
            <div style="background:#010409; border:1px solid #34d399; padding:5px 20px; border-radius:4px; text-align:center;">
                <span style="font-size:9px; color:#8b949e; display:block; font-weight:bold;">LEDGER SCORE</span>
                <div id="pts" style="color:#34d399; font-size:22px; font-weight:900;">0</div>
            </div>
        </div>
    </header>

    <main class="workspace-grid">
        <div class="media-split">
            <!-- Advanced Multi-Subject System Layout -->
            <div class="hud-panel">
                <span style="font-size:11px; color:var(--accent-color); font-weight:bold; margin-bottom:10px; letter-spacing:1px;">// MULTI-SUBJECT MATRIX QUEUE</span>
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <input id="sub" type="text" placeholder="ADD NEW SUBJECT TARGET..." class="cyber-input" style="margin-bottom:0;">
                    <button onclick="addSubjectToQueue()" class="action-btn" style="white-space:nowrap;">+ ADD</button>
                </div>
                
                <!-- Targets List Container -->
                <div id="subject-queue" style="max-height: 120px; overflow-y: auto; margin-bottom: 10px;"></div>
                
                <div style="border-top: 1px dashed #30363d; padding-top: 10px; display: flex; align-items: center; justify-content: space-between;">
                    <span id="active-target-lbl" style="font-size:11px; color:#8b949e;">Active: None Selected</span>
                    <button id="push-btn" onclick="startStudyGate()" class="action-btn" style="padding: 0 30px; height: 35px;" disabled>PUSH</button>
                    <div id="timer-display" style="font-weight: bold; color: var(--accent-color);"></div>
                </div>

                <div id="timeline" class="timeline-scroll"></div>
            </div>

            <!-- Reward Exchange Matrix -->
            <div class="hud-panel" style="border-top-color:#f59e0b;">
                <span style="font-size:11px; color:#f59e0b; font-weight:bold; margin-bottom:5px;">// LEDGER SCORE SHOP / REWARDS</span>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px;">
                    <button onclick="claimReward(100, '1 CODM Match')" class="dock-btn" style="border-color:#f59e0b; color:#fff; font-size:10px;">1 CODM MATCH (100 PTS)</button>
                    <button onclick="claimReward(200, '30 Min Break')" class="dock-btn" style="border-color:#f59e0b; color:#fff; font-size:10px;">30 MIN BREAK (200 PTS)</button>
                </div>
            </div>
        </div>

        <div class="media-split">
            <!-- Fixed YouTube Core Frame Player -->
            <div class="hud-panel" style="border-top-color:#3b82f6;">
                <span style="font-size:11px; color:#3b82f6; font-weight:bold; margin-bottom:10px; letter-spacing:1px;">// LIVE VIDEO CORE ENGINE</span>
                <div class="video-container">
                   <video autoplay loop muted playsinline style="width: 100%; height: 100%; object-fit: cover; border-radius: 4px;">
    <source src="https://mixkit.co" type="video/mp4">
    Your browser engine does not support video playbacks.
</video>

                </div>
            </div>

            <div class="hud-panel" style="border-top-color:#10b981;">
                <span style="font-size:11px; color:#10b981; font-weight:bold; margin-bottom:10px; letter-spacing:1px;">// MULTI-MATRIX EXTERNAL LINKS</span>
                <div class="social-dock">
                    <a href="https://discord.com" target="_blank" class="dock-btn">DISCORD PANEL</a>
                    <a href="https://github.com" target="_blank" class="dock-blank">GITHUB REPO</a>
                    <a href="https://reddit.com" target="_blank" class="dock-btn">REDDIT MATRIX</a>
                    <a href="https://youtube.com" target="_blank" class="dock-btn">YOUTUBE MAIN</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Tactical Mission Audio Synthesizer Element -->
    <audio id="alarm-sound" src="https://google.com" preload="auto"></audio>

    <script>
        let countdownInterval = null;
        let subjectsList = [];
        let selectedSubjectIndex = null;

        async function fetchProfile() {
            try {
                const res = await fetch('/api/profile');
                const data = await res.json();
                document.getElementById('pts').innerText = data.points;
                renderHistory(data.history);
            } catch (err) { console.error("HUD Sync breakdown.", err); }
        }

        function changeTheme(colorCode) {
            document.documentElement.style.setProperty('--accent-color', colorCode);
            document.documentElement.style.setProperty('--accent-glow', colorCode + '1A');
        }

        function addSubjectToQueue() {
            const input = document.getElementById('sub');
            const name = input.value.trim();
            if(!name) return;
            subjectsList.push(name);
            input.value = '';
            renderQueue();
        }

        function renderQueue() {
            const container = document.getElementById('subject-queue');
            container.innerHTML = '';
            subjectsList.forEach((sub, idx) => {
                const div = document.createElement('div');
                div.className = 'queue-item';
                div.style.borderColor = selectedSubjectIndex === idx ? 'var(--accent-color)' : '#30363d';
                div.innerHTML = `
                    <span>${sub}</span>
                    <button onclick="selectSubject(${idx})" class="action-btn" style="padding:2px 8px; font-size:9px;">SELECT</button>
                `;
                container.appendChild(div);
            });
        }

        function selectSubject(idx) {
            if(countdownInterval) return; // Locked during countdown
            selectedSubjectIndex = idx;
            document.getElementById('active-target-lbl').innerText = `Active: ${subjectsList[idx]}`;
            document.getElementById('push-btn').disabled = false;
            renderQueue();
        }

        function startStudyGate() {
            if(selectedSubjectIndex === null) return;
            const pushBtn = document.getElementById('push-btn');
            const timerDisplay = document.getElementById('timer-display');

            pushBtn.disabled = true;
            let totalSeconds = 25 * 60; // 25 Minute Gate Pipeline
            
            function updateTimerUI() {
                const mins = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
                const secs = (totalSeconds % 60).toString().padStart(2, '0');
                timerDisplay.innerText = `⏱️ ${mins}:${secs}`;
            }

            updateTimerUI();

            countdownInterval = setInterval(async () => {
                totalSeconds--;
                updateTimerUI();

                if (totalSeconds <= 0) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                    timerDisplay.innerText = "";
                    
                    // Trigger Option B Audio Synthesizer
                    document.getElementById('alarm-sound').play().catch(e => console.log("Audio block context reset required"));

                    try {
                        const res = await fetch('/api/complete-session', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' }
                        });
                        const data = await res.json();
                        if(data.success) {
                            fetchProfile();
                        }
                    } catch (err) { console.error("Database pipeline execution error", err); }

                    pushBtn.disabled = false;
                }
            }, 1000);
        }

        async function claimReward(cost, rewardName) {
            try {
                const res = await fetch('/api/claim-reward', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cost, rewardName })
                });
                const data = await res.json();
                if(data.success) {
                    fetchProfile();
                } else {
                    alert(data.error || "Transaction denied.");
                }
            } catch (err) { console.error("Store transmission error.", err); }
        }

        function renderHistory(history) {
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';
            [...history].reverse().forEach(item => {
                const card = document.createElement('div');
                card.className = 'timeline-card';
                card.innerHTML = `<span>${item.action}</span><span style="color:#8b949e; font-size:10px;">${new Date(item.timestamp).toLocaleTimeString()}</span>`;
                timeline.appendChild(card);
            });
        }

        window.onload = fetchProfile;
    </script>
</body>
</html>
